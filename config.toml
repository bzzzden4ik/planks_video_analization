# Настройки системы подсчёта досок.
# Строки, начинающиеся с #, — комментарии, программа их не читает.
# Числа пишутся с точкой: 12.5, а не 12,5.

[video]
# Путь к видеофайлу (относительно папки проекта).
path = "sample.mp4"

[marker]
# Реальные размеры красного маркера (планка под лестницей), в сантиметрах.
length_cm = 100.0
# ВНИМАНИЕ: ширину пока не знаем — впишите измеренное значение.
width_cm = 5.0

[boards]
# N — длина нормальной доски, в сантиметрах.
# Принята равной длине первой доски в sample.mp4 (measure_first_board.py).
normal_length_cm = 1000.0

# Допустимая погрешность, в процентах.
# Доска считается выбросом (слишком короткой), если она короче N
# на этот процент и более: длина <= N * (1 - процент / 100).
# Пример: N = 600 см, 10 %  ->  выброс, если длина <= 540 см.
tolerance_percent = 10.0
